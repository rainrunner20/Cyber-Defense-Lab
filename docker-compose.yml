# Local training simulation only. Do not expose these ports to the internet.
services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      DATABASE_URL: postgresql+psycopg2://cyberlab:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/cyberlab
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set a random JWT_SECRET_KEY}
      FRONTEND_ORIGINS: http://localhost:5173
    depends_on:
      - db
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on:
      - backend
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cyberlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: cyberlab
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
